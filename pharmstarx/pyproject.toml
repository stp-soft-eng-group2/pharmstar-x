#following https://setuptools.pypa.io/en/latest/userguide/quickstart.html

#declares build system dependencies. which library
[build system]
requires = ["setuptools"]
#version?
build-backend = "setuptools.build_meta"

[project]
name = "pharmstarx"
version = "0.0.1"
requires-python = ""3.13.12" 


[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}



[tool.pytest.ini_options] 
# if not using pytest-django. this is so they know to use settings
DJANGO_SETTINGS_MODULE = "pharmstarx.settings"

